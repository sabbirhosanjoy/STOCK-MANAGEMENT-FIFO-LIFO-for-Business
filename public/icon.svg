<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle for Android squircle safe zone -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Subtle ornamental circular border -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 10" opacity="0.4"/>
  <circle cx="256" cy="256" r="172" fill="#042f2e" opacity="0.6"/>

  <!-- NakshaLata Floral & Bengali Glyph Centerpiece -->
  <g filter="url(#shadow)">
    <!-- Leaf / vine motif (লতা) -->
    <path d="M256 120 C220 160 200 200 256 240 C312 200 292 160 256 120 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <circle cx="256" cy="120" r="10" fill="#fef08a"/>

    <!-- Bengali Letter 'ন' (NakshaLata) -->
    <text x="256" y="325" font-family="'Hind Siliguri', 'Noto Sans Bengali', Arial, sans-serif" font-size="190" font-weight="900" fill="#ffffff" text-anchor="middle">ন</text>
  </g>

  <!-- Subtitle Text -->
  <text x="256" y="390" font-family="'Hind Siliguri', sans-serif" font-size="28" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">নকশালতা</text>
  <text x="256" y="420" font-family="sans-serif" font-size="16" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">NAKSHALATA</text>
</svg>
